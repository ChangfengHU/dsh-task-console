lay:flex;justify-content:flex-end;gap:10px;margin-top:24px}.modal label{display:block;margin:18px 0 8px}.modal input,.modal textarea{width:100%;border:1px solid var(--line);background:var(--bg);padding:10px;border-radius:8px}.modal textarea{height:120px}.check{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.check span{color:var(--muted)}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 20px;background:var(--text);color:var(--bg);border-radius:9px;z-index:40;max-width:90vw;box-shadow:var(--shadow)}.mobile{display:none}.hint{margin-top:32px;font-size:12px;color:var(--muted)}.asideheading{font-size:12px;color:var(--muted);margin-bottom:12px}.footerlinks{display:flex;gap:14px;font-size:12px}.composer{max-width:820px;margin:30px auto;border:1px solid var(--line);border-radius:14px;padding:20px}.composer textarea{width:100%;height:150px;border:0;resize:vertical;background:var(--bg);outline:none}.chatbody{max-width:820px;margin:45px auto}.sample{border-left:2px solid var(--line);padding:16px 20px;margin:20px 0}.badgecount{font-size:11px;color:var(--muted);margin-left:5px}.tools{padding:12px;background:var(--soft);border-radius:6px;margin-top:10px}.scope-list{padding-left:20px}.scope-list li{margin-bottom:10px}body.dark .icon{background:#433e33;color:#e4cfaa}@media(min-width:1700px){.inner{max-width:1320px}.split{grid-template-columns:minmax(0,1fr) 330px}}@media(max-width:1000px){.app{grid-template-columns:205px minmax(0,1fr)}.content{padding:24px}.split{grid-template-columns:1fr;gap:22px}.grid{grid-template-columns:1fr}.search{width:210px}.sidebar{padding-inline:8px}}@media(max-width:650px){.app{display:block;height:100dvh}.main{height:100dvh}.sidebar{display:none;position:fixed;inset:0 auto 0 0;width:248px;z-index:15;box-shadow:var(--shadow)}body.menu .sidebar{display:flex}.mobile{display:inline-block}.top{padding:0 14px;height:54px}.content{padding:20px 16px}.intro .ro let installed=false,enabled=true,tab='Overview',filter='全部',query='',connected=new Set(),excluded=new Set(),draft='',lastFocus=null,toastTimer;

function modal(title,body,footer=''){lastFocus=document.activeElement;$('#modalroot').innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><header><h2>'+title+'</h2><button class="flat" onclick="closeModal()" aria-label="关闭">×</button></header>'+body+'<footer>'+footer+'</footer></section></div>';$('#modalroot button')?.focus()}

function base(html,crumb='Apps'){document.body.classList.remove('menu');$('#crumb').textContent=crumb;$('#content').innerHTML='<div class="inner">'+html+'</div>';$('#content').scrollTop=0}

function list(){base('<div class="intro"><div class="row between wrap"><div><h1>Apps</h1><div class="muted">把一组能力带进你的工作，而不只是安装一份文件。</div></div><div class="row wrap"><button onclick="importConfig()">↓ 导入配置</button><button onclick="exportConfig()">↑ 导出配置</button><button class="primary" onclick="add()">＋ 添加 App</button></div></div></div><div class="row between wrap"><div class="tabs">'+['全部','已安装','可添加'].map(t=>'<button class="'+(filter===t?'on':'')+'" onclick="filter=\''+t+'\';list()">'+t+'</button>').join('')+'</div><input class="search" aria-label="搜索 Apps" placeholder="搜索应用、作者或能力…" value="'+esc(query)+'" oninput="query=this.value;cards()"></div><div id="cards"></div><div class="hint">Apps 打包 Skills、MCP、指令与 Hooks。原有 Settings → Skills / MCP / Plugins 均保留。<br>配置迁移包只包含 Agent、Task、Action、Schedule 和能力引用，不含执行记录或密钥。<br><button class="flat" onclick="scope()">查看本次新增与保留的范围 ↗</button></div>');cards()}

function detail(t='Overview'){tab=t;base('<button class="flat" onclick="list()">← Apps</button><div class="hero"><div class="icon">▧</div><div class="grow"><h1>卡通视频工作室</h1><div class="muted">cartoon-video-studio <span class="badgecount">by ChangfengHU · v0.7.2</span></div></div><div class="row actions">'+(installed?'<button onclick="manage()">管理</button><button class="primary" onclick="use()">在会话中使用 ↗</button>':'<button class="primary" onclick="installPreview()">安装 App</button>')+'</div></div><div class="row wrap" style="margin-bottom:22px"><span class="tag '+(installed?'warn':'')+'">'+state()+'</span><span class="muted" style="font-size:12px">清单来自真实仓库 · 连接与安装状态均为交互演示</span></div><div class="tabs">'+['Overview','Skills','MCP','Commands','Hooks','Contents'].map(x=>'<button class="'+(tab===x?'on':'')+'" onclick="detail(\''+x+'\')">'+x+(x==='Skills'?'<span class="badgecount">29</span>':x==='MCP'?'<span class="badgecount">8</span>':'')+'</button>').join('')+'</div><div id="tabbody"></div>','Apps / 卡通视频工作室');renderTab()}
function renderTab(){let b=$('#tabbody');if(tab==='Overview')b.innerHTML='<div class="split"><div><div class="label">FROM IDEA TO FILM</div><h2 style="margin:12px 0">角色有自己的声音，故事有连续的表演。</h2><p class="description muted">把角色设计、声音制作、导演编排、素材管理和质量验收组合起来。先确定参考与角色，再制作试片、审阅并交付；安装本身不会生成视频或自动发布。</p><div class="rule"></div><h3>试着这样开始</h3><small>点击只填入提示词，你可以编辑后再发送。</small>'+prompts.map((p,i)=>'<button class="try" onclick="use('+i+')">'+p+' <span>↗</span></button>').join('')+'<h3 style="margin-top:28px">你会获得什么</h3><div class="feature">◉ 角色与形象 <small>　角色预设、参考锁、私有档案</small></div><div class="feature">♫ 配音与表演 <small>　按角色选声、时序编排与试片</small></div><div class="feature">✓ 成片验收 <small>　实际视频证据、修订与人工审阅</small></div></div><aside><div class="box"><h3>使用前检查</h3><div class="feature row between"><span>Skill 清单</span><small>29 项</small></div><div class="feature row between"><span>MCP 连接</span><small>'+connected.size+' / 8（模拟）</small></div><div class="feature"><span>DSH 适配</span><small style="display:block">尚未实现，当前仅为方案原型</small></div><button style="width:100%;margin-top:16px" onclick="detail(\'MCP\')">查看连接与缺项</button></div><div class="callout">通用 Agent 继承已就绪且未被排除的能力；专用 Agent 沿用自己的配置。安装成功不代表当前会话已加载。</div><div class="footerlinks"><a href="https://github.com/ChangfengHU/cartoon-video-skills" target="_blank" rel="noopener">GitHub ↗</a><button class="flat" onclick="detail(\'Contents\')">查看文件</button></div></aside></div>';
else if(tab==='Skills')b.innerHTML='<div class="row between wrap"><h2>Skills <small>29 个真实目录</small></h2><input class="search" placeholder="搜索 Skill…" aria-label="搜索 Skill" oninput="skillRows(this.value)"></div><small>按需加载；点击查看用途、来源与可用范围。详情描述为原型说明，完整内容以仓库为准。</small><div id="skillrows"></div>',skillRows('');
else if(tab==='MCP')b.innerHTML='<h2>连接你的工具</h2><p class="muted">同名连接优先复用。缺少凭据时明确标出，不把“已声明”当作“已连接”。</p><div class="callout">以下状态为可切换的演示数据，未请求真实服务；正式版展示实际注册工具、失败原因和验证时间。</div>'+mcps.map((m,i)=>'<button class="listrow" onclick="connection('+i+')"><span class="dot '+(connected.has(i)?'good':'pending')+'"></span><div class="grow"><h3>'+m+'</h3><small>HTTP MCP · '+(connected.has(i)?'已连接（演示）':'待绑定宿主凭据 / 检查连接')+'</small></div><span class="muted">配置 →</span></button>').join('');
else if(tab==='Commands')b.innerHTML='<h2>指令入口</h2><p class="muted">此包的快捷入口以薄 Skill 实现，不另造一份 Commands 清单。点击填入会话，保留原提示词编辑流程。</p>'+skills.filter(x=>['studio','studio-help','studio-new','studio-ali','studio-hongyi','studio-xiabanxiaoren','studio-materials','studio-check','studio-revise','studio-publish'].includes(x)).map(x=>'<button class="listrow" onclick="command(\''+x+'\')"><span>／</span><div class="grow"><h3>'+x+'</h3><small>来源：skills/'+x+'/SKILL.md · 填入草稿，不自动执行</small></div><span>↗</span></button>').join('');
else if(tab==='Hooks')b.innerHTML='<h2>Hooks</h2><div class="empty">本次核对的 manifest 没有声明 Hooks。<br>保留这个位置，供包含生命周期行为的 App 使用。</div><div class="callout">未来有 Hooks 的包需逐项显示事件、脚本、执行环境与授权。Codex / Claude 生命周期不能直接当作 DSH 生命周期；未适配项默认不执行。</div>';
else b.innerHTML='<div class="row between"><h2>Contents</h2><span class="tag">v0.7.2 · 清单快照</span></div><div class="fileview"><div class="tree">'+['README.md','.codex-plugin/plugin.json','skills/','.mcp.json'].map((f,i)=>'<button class="flat" onclick="file('+i+')">'+f+'</button>').join('')+'</div><div class="filebody" id="filebody"></div></div><small>只展示已核对的清单摘要；不是完整源码编辑器。凭据值不进入浏览器。</small>',file(0)}
function skillRows(q){$('#skillrows').innerHTML=skills.filter(s=>s.includes(q.toLowerCase())).map(s=>'<button class="listrow" onclick="skill(\''+s+'\')"><span class="tag">S</span><div class="grow"><h3>'+s+'</h3><small>skills/'+s+'/SKILL.md</small></div><small>'+(excluded.has(s)?'通用 Agent 已排除（演示）':'按需加载')+'</small><span>→</span></button>').join('')||'<div class="empty">没有匹配的 Skill</div>'}
function skill(s){modal(s,'<span class="tag">Skill · App 提供</span><p style="margin-top:18px">来源：<code>skills/'+s+'/SKILL.md</code></p><p class="muted">完整指令由仓库维护。安装后出现在既有 Skills 管理页，不复制出第二份独立配置。</p><div class="check">通用 Agent <span>'+(excluded.has(s)?'显式排除（演示）':'默认继承已就绪能力')+'</span></div><div class="check">专用 Agent <span>遵循角色工具和 Skill 配置</span></div><div class="callout">这里的排除操作只演示配置交互，不修改任何真实 Agent。</div>','<button onclick="toggleSkill(\''+s+'\')">'+(excluded.has(s)?'恢复默认继承':'排除通用 Agent')+'</button><button class="primary" onclick="command(\''+s+'\')">填入会话</button>')}
function toggleSkill(s){excluded.has(s)?excluded.delete(s):excluded.add(s);skill(s);if($('#skillrows'))skillRows('')}
function connection(i){modal(mcps[i],'<p class="muted">连接状态：'+(connected.has(i)?'已连接（演示）':'未验证（演示）')+'</p><div class="check">协议 <span>HTTP MCP</span></div><div class="check">来源 <span>App 的 .mcp.json</span></div><div class="check">凭据方式 <span>宿主端引用；前端不接收明文</span></div><div class="callout">演示连接成功、待连接两种状态。正式版先查可复用连接，并按真实结果展开工具清单；不自动授予专用 Agent。</div><p>工具清单：<span class="muted">尚未查询真实运行时，不虚构工具数量。</span></p>','<button onclick="connected.delete('+i+');closeModal();detail(\'MCP\')">模拟断开</button><button class="primary" onclick="connected.add('+i+');closeModal();detail(\'MCP\');toast(\'已模拟连接；没有访问真实 MCP\')">模拟连接成功</button>')}
function file(i){let texts=['# 卡通视频工作室\n\n角色设计 → 选声与表演 → 试片 → 验收与修订。\n\n来源：ChangfengHU/cartoon-video-skills\n本页为 README 摘要，不是原文。\n\n完整文档请访问 GitHub。',JSON.stringify({name:'cartoon-video-studio',version:'0.7.2',skills:'./skills/',mcpServers:'./.mcp.json'},null,2),skills.join('\n'),JSON.stringify({mcpServers:mcps,notice:'仅列声明名称；未嵌入任何凭据或连接配置'},null,2)];$('#filebody').innerHTML='<div class="label">READ ONLY · SUMMARY</div><pre>'+esc(texts[i])+'</pre><a href="https://github.com/ChangfengHU/cartoon-video-skills/tree/main/plugins/cartoon-video-studio" target="_blank" rel="noopener">打开真实源码 ↗</a>'}
function add(){modal('添加 App','<p class="muted">粘贴来源，我们先解析安装清单，不直接执行命令。</p><label for="source">GitHub / Marketplace / 安装指令</label><textarea id="source">codex plugin marketplace add ChangfengHU/cartoon-video-skills && codex plugin add cartoon-video-studio@personal</textarea><small>此原型仅支持上面的示例仓库。正式版须校验来源、版本和清单，不执行粘贴的任意 shell。</small>','<button onclick="closeModal()">取消</button><button class="primary" onclick="parseSource()">解析来源 →</button>')}
function parseSource(){if(!$('#source').value.includes('ChangfengHU/cartoon-video-skills')){toast('原型仅提供指定仓库的示例数据');return}closeModal();detail();installPreview()}
function installPreview(){modal('安装前检查','<div class="row"><div class="icon">▧</div><div><h3>卡通视频工作室</h3><small>personal / cartoon-video-studio · 0.7.2</small></div></div><div class="callout">静态演示：不运行 Codex 命令，不写入 DSH，不发送凭据。</div><div class="check">29 Skills <span>登记来源；同名冲突须确认，不覆盖</span></div><div class="check">8 MCP 声明 <span>复用已有连接，缺项待绑定</span></div><div class="check">角色快捷入口 <span>来自 Skill；沿用会话草稿交互</span></div><div class="check">Hooks <span>manifest 未声明</span></div><div class="check">运行环境 <span>需要正式检查，不随 App 自动安装</span></div><div class="check">通用 Agent <span>默认继承；显式排除仍有效</span></div><p class="muted" style="margin-top:18px">DSH 适配器尚未开发。演示安装后可继续配置，但不会标成“真实可用”。</p>','<button onclick="closeModal()">取消</button><button class="primary" onclick="installed=true;enabled=true;closeModal();detail();toast(\'模拟安装完成，MCP 与运行环境仍待检查\')">模拟安装</button>')}
function manage(){modal('管理 App','<div class="check">安装状态 <span>'+state()+'</span></div><p class="muted" style="margin-top:18px">停用仅取消 App 对能力的供给，不删除共享 MCP、用户素材或独立安装的 Skill。当前会话已加载的上下文不会被抹去。</p>','<button onclick="uninstall()">卸载…</button><button class="primary" onclick="enabled=!enabled;closeModal();detail();toast(\'仅更新原型状态\')">'+(enabled?'停用 App':'启用 App')+'</button>')}
function uninstall(){modal('卸载卡通视频工作室？','<p>移除这个 App 的安装记录与专属文件。</p><div class="box">保留：共享 MCP 连接、独立安装的 Skill、凭据引用、用户素材、会话与任务历史。</div><div class="callout">本次只清除内存中的模拟安装标记，真实文件不受影响。</div>','<button onclick="closeModal()">取消</button><button class="primary" onclick="installed=false;closeModal();detail();toast(\'已模拟卸载；共享连接保留\')">确认模拟卸载</button>')}
function use(i=0){draft=prompts[i];chat()}
function command(s){closeModal();draft='使用 '+s+'，请帮我【填写你的目标】。';chat()}
function chat(){base('<button class="flat" onclick="detail()">← 返回 App</button><div class="chatbody"><span class="label">CURRENT CONVERSATION · PREVIEW</span><h1 style="margin-top:14px">卡通故事与角色设计</h1><p class="muted">保留当前会话与角色，不创建 Task，不自动发送。</p><div class="sample"><h3>App 提示词已放入草稿</h3><p class="muted">你可以修改目标、补充素材。正式版会显示当前会话实际加载状态；不会因安装 App 就假设工具已经可用。</p></div><div class="row wrap"><span class="tag">标准 Agent</span><span class="tag">'+state()+'</span></div></div><div class="composer"><textarea id="draft" aria-label="会话草稿" placeholder="Message the agent">'+esc(draft)+'</textarea><div class="row between"><button class="flat" onclick="detail(\'Commands\')">＠ App 指令</button><button class="primary" onclick="toast(\'原型不发送消息，也不会创建会话或任务\')">发送（演示） ↑</button></div></div>','Chat / 草稿预览');$('#draft').focus()}
function preserved(name){modal(name+' · 保留原有功能','<p>本次不修改 '+name+' 页面。原有 Agent、任务、Skills、MCP 与原生 Plugins 管理全部保留。</p><p class="muted">此静态页面只实现 Apps 新增流程，不连接生产服务。</p>','<button class="primary" onclick="closeModal()">返回原型</button>')}
function exportConfig(){modal('导出配置包','<p>仅导出可迁移配置，不包含会话、Run、Event、日志、附件或任何凭据值。</p><div class="check">Agent 配置 <span>包含</span></div><div class="check">Task / Link / Action / Schedule <span>包含</span></div><div class="check">Skill / MCP 引用 <span>包含名称和版本</span></div><div class="check">Vault 凭据 <span>仅保留 key 名称</span></div><div class="callout">静态演示不会真的读取本机数据库或上传 R2。正式版由宿主脚本生成包并上传，浏览器只接收结果。</div>','<button onclick="closeModal()">取消</button><button class="primary" onclick="exportReady()">生成并上传 R2（演示）</button>')}
function exportReady(){modal('配置包已生成','<div class="box"><div class="label">PUBLIC R2 URL</div><p style="overflow-wrap:anywhere"><a href="https://resource.vyibc.com/dsh-config-export/demo-20260916.json" target="_blank" rel="noopener">https://resource.vyibc.com/dsh-config-export/demo-20260916.json ↗</a></p><div class="check">SHA256 <span>演示校验值 · 仅供原型预览</span></div><div class="check">内容 <span>配置，不含执行记录</span></div></div><p class="muted">正式版导出结果会由服务端返回真实字节数和 SHA256；此页面不会展示包内内容。</p>','<button class="primary" onclick="closeModal();toast(\'已复制 R2 地址（演示）\')">复制地址（演示）</button>')}
function importConfig(){modal('从 R2 导入配置','<p class="muted">粘贴由另一台 DSH 导出的 HTTPS R2 地址。只接受配置迁移包，不接受任意脚本或本地路径。</p><label for="importurl">R2 配置地址</label><input id="importurl" value="https://resource.vyibc.com/dsh-config-export/demo-20260916.json" placeholder="https://resource.vyibc.com/...json"><small>正式版会校验 HTTPS、来源域名、manifest、SHA256 和包版本。</small>','<button onclick="closeModal()">取消</button><button class="primary" onclick="importPreview()">校验并预览 →</button>')}
function importPreview(){const v=$('#importurl').value.trim();if(!/^https:\/\/resource\.vyibc\.com\/.+\.json(?:\?.*)?$/.test(v)){toast('只接受 resource.vyibc.com 的 HTTPS 配置包');return}modal('导入前预览','<div class="callout">已通过地址格式检查（演示）。正式版将在写入前验证包签名和内容哈希。</div><div class="check">Agent <span>3 个新增 / 1 个同 ID 冲突</span></div><div class="check">Task 工作流 <span>2 个新增 / 不导入历史执行</span></div><div class="check">Skill / MCP 引用 <span>检查本机是否存在，缺项不会静默安装</span></div><div class="check">Schedule <span>导入为停用状态，需手动启用</span></div><p class="warn">导入不会恢复会话，不会启动 Task，也不会导入凭据明文。</p>','<button onclick="closeModal()">取消</button><button class="primary" onclick="closeModal();toast(\'已模拟导入配置；任务保持停用\')">确认导入（演示）</button>')}
function scope(){modal('本次改造范围','<ul class="scope-list"><li><b>保留：</b>会话、文件夹、置顶收藏、Agent、Board、Settings，以及现有 Skills / MCP / Plugins 管理。</li><li><b>新增：</b>Apps 入口、应用列表与详情、来源解析、安装清单预览、连接缺项和草稿使用入口。</li><li><b>增强：</b>配置导出/导入入口；正式实现建议放在 dsh-task-console 的迁移服务，并由 dsh-skill-mcp-console 展示 Apps 聚合层。</li><li><b>边界：</b>原生 Plugin 扩展 DSH；App 为 Agent 提供一组能力。两者不混成同一列表。</li><li><b>未执行：</b>真实安装、配置上传、Agent 授权、Hook 执行和线上部署。本页所有运行状态都是演示。</li></ul>','<button class="primary" onclick="closeModal()">继续体验</button>')}
list();
</script></body></html>
