<div class="proto"><span><strong>交互原型 · V1</strong><span class="explain">　演示数据，不连接生产，不执行任务</span></span><label>演示状态 <select id="scenario" class="demo-select" aria-label="切换演示状态"><option value="running">执行中</option><option value="blocked">受阻 / 未通过</option><option value="done">已完成 / 已通过</option></select></label></div>

 <div class="crumbs"><span class="brand">DSH</span><span class="slash">/</span><button class="plain small" data-dialog="context">Board</button><span class="slash">/</span><span>执行详情</span><span class="spacer"></span><button class="icon plain" id="theme" aria-label="切换深浅主题" title="切换深浅主题">◐</button></div>
 <header class="headline"><div class="title"><h1>Fleet 基础节点幂等接入与 Gemini 账号验收</h1><div class="subtitle"><span>示例节点 <code>192.0.2.63</code></span><span>保留健康环境与登录</span><span id="run-code" class="mono">#DEMO22</span></div></div><div class="tools"><select id="execution" class="execution-select" aria-label="选择执行记录"><option value="current">09-14 19:47 · 本次演示</option><option value="previous">09-13 10:00 · 历史演示</option></select><button class="plain small" data-dialog="sessions">会话 <span id="session-count" class="badge">3</span></button><button class="primary small" data-dialog="report">验收与结果 <span>↗</span></button><button class="icon" data-dialog="more" aria-label="更多操作">···</button></div></header>
 <div class="statusline"><span id="overall" class="badge good"><i class="dot"></i>执行中</span><strong id="current-summary">浏览器管理员正在独立验证 Gemini 登录</strong><span class="status-meta" id="status-meta">2 / 3 角色完成 · 验收观察中</span></div>
 <section class="workspace" id="workspace" aria-label="任务执行工作区">
  <div class="flow-panel">
   <div class="panel-head"><div class="row"><h2>协作流程</h2><span class="hint" id="flow-meta">3 个角色 · 顺序交接</span></div><div class="row"><button class="plain small" data-dialog="plan">查看计划</button><button class="small" id="fullscreen" aria-label="全屏协作流程">⛶ <span>全屏</span></button></div></div>
   <div class="canvas" id="canvas"><div class="diagram-wrap" id="diagram-wrap"><span class="canvas-note">WORKFLOW <span id="canvas-mode">/ 当前执行</span></span><div class="diagram" id="diagram"></div></div></div>
   <div class="legend"><span class="row"><i class="dot" style="color:var(--green)"></i>已完成</span><span class="row"><i class="dot" style="color:var(--accent)"></i>运行中</span><span class="row"><i class="dot" style="color:var(--muted)"></i>等待</span><button class="plain small mobile-detail-trigger" id="show-detail">角色详情 ↗</button><div class="zoom"><button class="plain icon" id="zoom-out" aria-label="缩小流程图">−</button><span id="zoom-label">100%</span><button class="plain icon" id="zoom-in" aria-label="放大流程图">＋</button><button class="plain small" id="fit">适配</button></div></div>

  </div>

 </section>

 else if(kind==='more'){title='任务与执行';html='<button class="session-entry" data-dialog="action">查看 Task Action <span>→</span></button><button class="session-entry" data-dialog="plan">任务定义与协作计划 <span>→</span></button><button class="session-entry" data-dialog="events">完整事件列表 <span>→</span></button><p class="mini-note">原型不提供真实取消、删除、重新执行入口，也不会向当前任务发送消息。</p>'}
 else if(kind==='action'){title='Task Action · 装机与账号验收';html='<p>次要配置按需查看，不挤占执行主画布。</p><div class="action-prompt" style="margin:14px 0">请对 <span class="placeholder">【机器 IP】</span> 执行已审查的 Fleet 基础节点幂等接入与 Gemini 账号验收。<br>SSH 接入：<span class="placeholder">使用金库</span><br>账号选择：<span class="placeholder">按账号分配策略</span><br>保留健康组件与登录，不卸载重装，不修改令牌。</div><p>这里只预览模板。正式插件通过原生会话输入调用 Action；本原型不启动新执行。</p>'}
 else if(kind==='events'){title='完整事件 · 当前回放时刻';html='<p>原始事件保留，默认主视图仅突出当前有效变化。</p>'+frames.slice(0,cursor+1).map((e,i)=>'<button class="session-entry" data-frame="'+i+'"><span>'+String(i+1).padStart(2,'0')+'　'+(blocked&&i===9?'登录状态无法确认':e.title)+'<small class="mono">'+e.kind+' · '+e.t+' UTC+8</small></span><span>回放 ↗</span></button>').join('')}
 else if(kind==='summary'||kind==='html-preview'){title=kind==='summary'?'验收摘要 · 演示':'HTML 报告 · 演示预览';const d=report();html='<div class="result-hero"><h2>'+escape(d.title)+'</h2><p>节点 '+d.target+' · #'+d.execution+'</p></div><h3>结论：'+(d.verdict==='passed'?'示例窗口通过':d.verdict==='blocked'?'受阻，未通过':'进行中，尚未通过')+'</h3><p>观察 '+d.browserAcceptance.observedMinutes+' / 20 分钟；原有浏览器、资料和健康登录保留。请返回正式执行页核查真实结果，此文档不可作为生产验收证据。</p><button class="small" style="margin-top:15px" data-dialog="report">返回验收与结果</button>'}
 else{title='独立执行页原型';html='<p>这里只设计 Task 执行详情，不新增插件或主菜单。顶部、协作流程、角色详情和验收结果均可交互；不会跳转或修改线上任务。</p>'}
 $('#modal-title').textContent=title;$('#modal-content').innerHTML=html;if(!$('#modal').open)$('#modal').showModal();$('#modal-content').scrollTop=0;
}
document.addEventListener('click',e=>{const role=e.target.closest('[data-role]'),dialog=e.target.closest('[data-dialog]'),tabs=e.target.closest('[data-tab]'),session=e.target.closest('[data-session]'),jump=e.target.closest('[data-frame]');if(role){selected=Number(role.dataset.role);$('#workspace').classList.add('detail-open');render()}else if(dialog)openDialog(dialog.dataset.dialog);else if(tabs){tab=tabs.dataset.tab;renderDetail(frame());$$('.tabs button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-selected',b.dataset.tab===tab)})}else if(session){selected=roles.findIndex(r=>r.id===session.dataset.session);render();openDialog('conversation')}else if(jump){stop();move(Number(jump.dataset.frame));$('#modal').close()}else if(e.target.closest('#view-trace')){$('#modal').close();tab='trace';$('#workspace').classList.add('detail-open');render()}else if(e.target.closest('#download')){const url=URL.createObjectURL(new Blob([JSON.stringify(report(),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='demo-fleet-acceptance.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已下载演示 JSON，不是生产验收结果。')}});
$('#modal-close').onclick=()=>$('#modal').close();$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const b=$('#modal').getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)$('#modal').close()}});
$('#scenario').onchange=e=>scenario(e.target.value);$('#execution').onchange=e=>{previous=e.target.value==='previous';scenario(previous?'done':'running')};
$('#first').onclick=()=>{stop();move(0)};$('#prev').onclick=()=>{stop();move(cursor-1)};$('#next').onclick=()=>{stop();move(cursor+1)};$('#cursor').oninput=e=>{stop();move(Number(e.target.value))};$('#latest').onclick=()=>{stop();move(latestFrame)};
function play(){if(timer){stop();return}if(cursor>=latestFrame)move(0);$('#play').textContent='Ⅱ';$('#play').setAttribute('aria-label','暂停播放');timer=setInterval(()=>{move(cursor+1);if(cursor>=latestFrame)stop()},Number($('#speed').value))}$('#play').onclick=play;$('#speed').onchange=()=>{if(timer){stop();play()}};
$('#theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'};
$('#fullscreen').onclick=()=>{const full=$('#workspace').classList.toggle('expanded');$('#fullscreen span').textContent=full?'退出全屏':'全屏';$('#fullscreen').setAttribute('aria-label',full?'退出全屏协作流程':'全屏协作流程')};
$('#close-detail').onclick=()=>$('#workspace').classList.remove('detail-open');$('#show-detail').onclick=()=>$('#workspace').classList.add('detail-open');
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').open){$('#workspace').classList.remove('expanded','detail-open');$('#fullscreen span').textContent='全屏';$('#fullscreen').setAttribute('aria-label','全屏协作流程')}});
$('#zoom-in').onclick=()=>{zoom=Math.min(1.5,zoom+.1);render()};$('#zoom-out').onclick=()=>{zoom=Math.max(.5,zoom-.1);render()};$('#fit').onclick=()=>{zoom=Math.max(.45,Math.min(1,($('#canvas').clientWidth-10)/810));render();$('#canvas').scrollLeft=($('#canvas').scrollWidth-$('#canvas').clientWidth)/2};
let drag=null;$('#canvas').onpointerdown=e=>{if(e.target.closest('button'))return;drag={x:e.clientX,scroll:$('#canvas').scrollLeft};$('#canvas').setPointerCapture(e.pointerId);$('#canvas').classList.add('dragging')};$('#canvas').onpointermove=e=>{if(drag)$('#canvas').scrollLeft=drag.scroll+drag.x-e.clientX};$('#canvas').onpointerup=$('#canvas').onpointercancel=()=>{drag=null;$('#canvas').classList.remove('dragging')};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});render();
$('#theme').innerHTML='<svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13a8 8 0 0 1-9-9 8 8 0 1 0 9 9Z"/></svg>';
$('#fullscreen').firstChild.replaceWith(document.createRange().createContextualFragment('<svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>'));
</script>
